# =============================================================================
# Yatırım Politikası — tüm eşikler, bantlar, maliyetler ve vergi oranları burada.
# Kodda sihirli sayı yoktur; bu dosya POLICY_FILE ile değiştirilebilir.
# Vergi/maliyet oranları BİLGİ AMAÇLIDIR; güncel mevzuatı kontrol edin.
# =============================================================================

version = "2026.09"

# --- Varlık sınıfları -----------------------------------------------------------
[asset_classes]
para_piyasasi = "TL Para Piyasası"
tl_tahvil = "TL Tahvil / Bono"
eurobond = "Eurobond"
altin = "Altın"
doviz = "Döviz"
bist_endeks = "BIST Geniş Endeks"
bist_hisse = "BIST Hisse Sepeti"

# --- Risk seviyeleri (1–10) ---------------------------------------------------------
[risk_levels]
labels = [
  "Çok Muhafazakâr", "Muhafazakâr", "Temkinli", "Temkinli-Dengeli", "Dengeli",
  "Dengeli-Büyüme", "Büyüme", "Büyüme-Agresif", "Agresif", "Çok Agresif",
]
# Profil geçerlilik süresi (gün) ve yenileme uyarısı (gün kala)
profile_validity_days = 365
renewal_warning_days = 30

# Seviye → izin verilen en yüksek enstrüman risk skoru (SRRI benzeri 1–7)
[suitability.max_instrument_risk]
"1" = 4
"2" = 4
"3" = 6
"4" = 7
"5" = 7
"6" = 7
"7" = 7
"8" = 7
"9" = 7
"10" = 7

# Kapasite ölçeği (0–100 puan → 1–10 seviye) eşikleri
[suitability.level_thresholds]
upper_bounds = [10, 20, 30, 40, 50, 60, 70, 80, 90, 101]

